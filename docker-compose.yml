services:
  # 1. In-Memory Redis Cache & Async Job Queue
  redis:
    image: redis:7-alpine
    container_name: traaya-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 2. FastAPI Backend Microservices
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: traaya-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  # 3. Next.js 16 Enterprise Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: traaya-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  redis_data:
    driver: local
